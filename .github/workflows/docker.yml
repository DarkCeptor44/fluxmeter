name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Custom image tag (defaults to 'edge' for manual runs)"
        required: false
        default: "edge"
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase username
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Determine Target Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.custom_tag }}"
          else
            RAW_TAG="${{ github.ref_name }}"
            TAG="${RAW_TAG#v}"
          fi
          echo "tag_name=${TAG}" >> ${GITHUB_OUTPUT}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:${{ steps.tag.outputs.tag_name }}-${{ matrix.arch }}

  merge:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase username
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Determine Target Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.custom_tag }}"
          else
            RAW_TAG="${{ github.ref_name }}"
            TAG="${RAW_TAG#v}"
          fi
          echo "tag_name=${TAG}" >> ${GITHUB_OUTPUT}

      - name: Create and push manifest
        run: |
          TARGET_TAG="${{ steps.tag.outputs.tag_name }}"

          docker buildx imagetools create -t ghcr.io/${{ env.REPO_LC }}:${TARGET_TAG} \
            ghcr.io/${{ env.REPO_LC }}:${TARGET_TAG}-amd64 \
            ghcr.io/${{ env.REPO_LC }}:${TARGET_TAG}-arm64

          if [ "${{ github.event_name }}" = "push" ]; then
            docker buildx imagetools create -t ghcr.io/${{ env.REPO_LC }}:latest \
              ghcr.io/${{ env.REPO_LC }}:${TARGET_TAG}-amd64 \
              ghcr.io/${{ env.REPO_LC }}:${TARGET_TAG}-arm64
          fi
