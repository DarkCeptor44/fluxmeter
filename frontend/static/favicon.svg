<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
    <defs>
        <linearGradient id="flux-icon-grad" x1="2" y1="22" x2="22" y2="2" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
    </defs>

    <!-- Gauge Arc -->
    <path d="M 4.93 19.07 A 10 10 0 1 1 19.07 19.07" stroke="url(#flux-icon-grad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Inner Gauge Track Accent -->
    <path d="M 7.76 16.24 A 6 6 0 1 1 16.24 16.24" stroke="#27272a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 3" />

    <!-- Flux Pulse Center Node -->
    <circle cx="12" cy="12" r="2.25" fill="url(#flux-icon-grad)" />

    <!-- Speed Needle Indicator -->
    <path d="M 12 12 L 17 7" stroke="url(#flux-icon-grad)" stroke-width="2" stroke-linecap="round" />
</svg>
